
; ==============================================================================
; CYBERPUNK — NEON NOIR
; Paleta: Midnight / Neon Pink / Cyber Mint / Ultraviolet / Electric Yellow
; ==============================================================================

[colors]
bg_dark      = #1B1B2A
bg_layer     = #25253A
fg_bright    = #00FFB3
fg_ivory     = #E8E8F0
accent_blue  = #A700FF
alert        = #FFEA00
neon_pink    = #FF007A
neon_mint    = #00FFB3
neon_purple  = #A700FF
neon_yellow  = #FFEA00

; ==============================================================================
; 1. BARRA SUPERIOR
; ==============================================================================

[bar/superior]
monitor = ${env:MONITOR:}

width = 100%
height = 32pt
bottom = false

background = ${colors.bg_dark}
foreground = ${colors.fg_ivory}

line-size = 3pt
line-color = ${colors.neon_pink}

radius = 0
border-size = 0
border-color = ${colors.neon_purple}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"

modules-left = arch_logo xworkspaces
modules-center = xwindow
modules-right = cpu cpu-temp memory battery volume date powermenu

cursor-click = pointer
enable-ipc = true

; ==============================================================================
; LOGO ARCH
; ==============================================================================

[module/arch_logo]
type = custom/text
format = "󰣇"
format-foreground = ${colors.neon_yellow}
format-font = 2
format-padding = 1

; ==============================================================================
; WORKSPACES
; ==============================================================================

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true

label-active = "◆ %name%"
label-active-foreground = ${colors.neon_mint}
label-active-background = ${colors.bg_layer}
label-active-underline = ${colors.neon_pink}
label-active-padding = 1

label-occupied = "◇ %name%"
label-occupied-foreground = ${colors.neon_pink}
label-occupied-padding = 1

label-empty = "· %name%"
label-empty-foreground = ${colors.neon_pink}
label-empty-padding = 1

; ==============================================================================
; JANELA ATIVA
; ==============================================================================

[module/xwindow]
type = internal/xwindow

label = "%title:0:50:...%"
label-foreground = ${colors.neon_yellow}
label-font = 2

label-empty = ""
label-empty-foreground = ${colors.neon_purple}

; ==============================================================================
; CPU
; ==============================================================================

[module/cpu]
type = internal/cpu
interval = 3

format-prefix = "  "
format-prefix-foreground = ${colors.neon_pink}
label = %percentage%%
label-foreground = ${colors.neon_mint}

; ==============================================================================
; TEMPERATURA
; ==============================================================================

[module/cpu-temp]
type = custom/script
exec = sensors | awk '/Package id 0:/ {gsub(/[+°C]/, "", $4); print $4 "°C"; exit}'
interval = 3

format-prefix = " "
format-prefix-foreground = ${colors.neon_pink}
label = %output%
label-foreground = ${colors.neon_mint}

; ==============================================================================
; MEMÓRIA
; ==============================================================================

[module/memory]
type = internal/memory
interval = 3

format-prefix = "󰍛 "
format-prefix-foreground = ${colors.neon_pink}
label = %percentage_used%%
label-foreground = ${colors.neon_mint}

; ==============================================================================
; BATERIA
; ==============================================================================

[module/battery]
type = internal/battery

full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>

label-charging = %percentage%%
label-charging-foreground = ${colors.neon_mint}

label-discharging = %percentage%%
label-discharging-foreground = ${colors.neon_mint}

label-full = "󰁹 100%"
label-full-foreground = ${colors.neon_mint}

label-low = "󰂃 %percentage%%"
label-low-foreground = ${colors.alert}

animation-charging-0 = "󰢜"
animation-charging-1 = "󰂇"
animation-charging-2 = "󰂊"
animation-charging-3 = "󰂋"
animation-charging-foreground = ${colors.neon_mint}
animation-charging-framerate = 750

ramp-capacity-0 = "󰁺"
ramp-capacity-1 = "󰁼"
ramp-capacity-2 = "󰁾"
ramp-capacity-3 = "󰂀"
ramp-capacity-4 = "󰁹"
ramp-capacity-foreground = ${colors.neon_pink}

; ==============================================================================
; DATA E RELÓGIO
; ==============================================================================

[module/date]
type = internal/date
interval = 1

date = "%{F#FF007A}󰥔 %{F#00FFB3}%H:%M"
date-alt = "%{F#FF007A}󰃭 %{F#00FFB3}%Y-%m-%d %{F#00FFB3}%H:%M:%S"

label = %date%
label-font = 1
label-foreground = ${colors.neon_mint}

; ==============================================================================
; MENU DE ENERGIA
; ==============================================================================

[module/powermenu]
type = custom/text

click-left = bspc quit

format = "󰐥"
format-foreground = ${colors.neon_yellow}
format-font = 2
format-padding = 1

; ==============================================================================
; ÁUDIO / VOLUME — PIPEWIRE
; ==============================================================================

[module/volume]

type = custom/script
exec = bash -c 'vol=$(wpctl get-volume @DEFAULT_AUDIO_SINK@); if echo "$vol" | grep -q "MUTED"; then printf "%%{F%s}󰝟 %%{F%s}Muted\n" "#FF007A" "#00FFB3"; else percent=$(echo "$vol" | awk "{print int(\$2 * 100)}"); printf "%%{F%s}󰕾 %%{F%s}%s%%\n" "#FF007A" "#00FFB3" "$percent"; fi'
interval = 1
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
format-background = ${colors.bg_dark}
format-padding = 1

