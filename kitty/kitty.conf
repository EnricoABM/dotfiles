# -----------------------------------------------------------------
#  KITTY CONFIGURATION: Art Deco + Gruvbox (Low RAM Edition)
# -----------------------------------------------------------------

# --- FONTE ---
font_family      JetBrains Mono Regular
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        18.0

# Desativa ligaduras para economizar processamento e RAM
disable_ligatures always

# --- PERFORMANCE & MEMÓRIA (Baixo Consumo) ---
# Limite estrito de linhas no histórico
scrollback_lines 2000

# Desativa o buffer de scrollback em paginação de disco (economiza I/O e RAM)
scrollback_pager_history_max_size 0

# Reduz o atraso de input e aumenta a taxa de atualização de forma eficiente
input_delay 3
repaint_delay 10
sync_to_monitor yes

# --- ESTÉTICA ART DECO & LAYOUT ---
# Bordas finas, limpas e geométricas
window_border_width 1.5pt
active_border_color #fabd2f
inactive_border_color #3c3836
window_padding_width 12

# Barra de abas minimalista e elegante (Estilo Art Deco)
tab_bar_style separator
tab_separator " │ "
tab_bar_edge top
tab_bar_margin_height 5.0 0.0
active_tab_foreground   #fdb03c
active_tab_background   #1d2021
active_tab_font_style   bold
inactive_tab_foreground #a89984
inactive_tab_background #1d2021
inactive_tab_font_style normal

# --- PALETA DE CORES: GRUVBOX (Dark Hard) ---
foreground            #ebdbb2
background            #1d2021
selection_foreground  #665c54
selection_background  #ebdbb2
url_color             #83a598
cursor                #fabd2f
cursor_text_color     #1d2021

# Black
color0  #282828
color8  #928374

# Red
color1  #cc241d
color9  #fb4934

# Green
color2  #98971a
color10 #b8bb26

# Yellow (Tom mais dourado puxando para o Art Deco)
color3  #d79921
color11 #fabd2f

# Blue
color4  #458588
color12 #83a598

# Magenta
color5  #b16286
color13 #d3869b

# Cyan
color6  #689d6a
color14 #8ec07c

# White
color7  #a89984
color15 #ebdbb2

# --- COMPORTAMENTO ---
# Desativa o som do terminal (beeps)
enable_audio_bell no
window_alert_on_bell no

# Atalhos básicos e leves de navegação
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
